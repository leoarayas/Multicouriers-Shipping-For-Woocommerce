name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none

      - name: Run test suite
        run: php tests/run-all.php

  i18n:
    name: i18n Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none

      - name: Check text domain usage
        shell: bash
        run: |
          echo "Checking i18n text domain consistency..."
          DOMAIN="multicouriers-shipping-for-woocommerce"
          ERRORS=0

          # Check that all translatable strings use the correct text domain
          while IFS= read -r -d '' file; do
            # Find __() and esc_html__() calls without correct domain
            while IFS= read -r line; do
              if echo "$line" | grep -qE "(__|esc_html__|esc_attr__|_e|esc_html_e|esc_attr_e)\(" ; then
                if echo "$line" | grep -qE "'$DOMAIN'" ; then
                  continue
                fi
                if echo "$line" | grep -qE "\"$DOMAIN\"" ; then
                  continue
                fi
                # Skip lines that are comments or don't have string calls
                if echo "$line" | grep -qE "^\s*//" ; then
                  continue
                fi
                # This line has a translatable string without the correct domain
                echo "WARNING: Possible missing text domain in: $file"
                echo "  $line"
                ERRORS=$((ERRORS + 1))
              fi
            done < <(grep -n "__\|esc_html__\|esc_attr__\|_e\|esc_html_e\|esc_attr_e" "$file" 2>/dev/null || true)
          done < <(find . -name "*.php" -not -path "./.git/*" -not -path "./vendor/*" -not -path "./tests/*" -print0)

          if [ $ERRORS -gt 0 ]; then
            echo ""
            echo "Found $ERRORS potential i18n issues. Please review."
            echo "Note: This is a warning, not a failure. Manual review recommended."
          else
            echo "No i18n issues detected."
          fi

      - name: Check for untranslated strings
        shell: bash
        run: |
          echo "Checking for common untranslated patterns..."
          DOMAIN="multicouriers-shipping-for-woocommerce"

          # Look for hardcoded user-facing strings that should be translated
          # This is a heuristic check - manual review still needed
          while IFS= read -r -d '' file; do
            # Skip test files and this workflow
            if echo "$file" | grep -qE "tests/|\.github/" ; then
              continue
            fi

            # Check for echo/print with hardcoded strings (potential i18n candidates)
            if grep -n "echo\s*['\"]" "$file" 2>/dev/null | grep -v "esc_html__\|esc_attr__\|__\|_e\|//\|#" | head -5 ; then
              echo "  ↑ Potential untranslated strings in: $file"
            fi
          done < <(find . -name "*.php" -not -path "./.git/*" -not -path "./vendor/*" -not -path "./tests/*" -print0)

          echo "Done. Review any warnings above."

  version-consistency:
    name: Version Consistency
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Validate version consistency
        run: php bin/validate-version.php

  lint:
    name: PHP Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Check PHP syntax
        shell: bash
        run: |
          echo "Checking PHP syntax..."
          ERRORS=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" > /dev/null 2>&1; then
              echo "SYNTAX ERROR: $file"
              php -l "$file"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find . -name "*.php" -not -path "./.git/*" -not -path "./vendor/*" -print0)

          if [ $ERRORS -gt 0 ]; then
            echo "Found $ERRORS files with syntax errors."
            exit 1
          else
            echo "All PHP files have valid syntax."
          fi
